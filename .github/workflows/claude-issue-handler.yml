name: Claude Issue Handler

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  claude-response:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'claude-assist') || contains(github.event.comment.body, '@claude')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get issue details and call Claude
        id: claude
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const issueTitle = issue.title;
            const issueBody = issue.body || '';
            const issueNumber = issue.number;

            // Call Claude API
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01'
              },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 4096,
                messages: [{
                  role: 'user',
                  content: `You are a helpful coding assistant working on a casino game analyzer web app. Review this GitHub issue and provide implementation guidance or code suggestions.

            Issue #${issueNumber}: ${issueTitle}

            ${issueBody}

            Provide specific code changes or implementation steps. Reference specific files like app.js, games/blackjack.js, etc. when relevant.`
                }]
              })
            });

            const data = await response.json();
            const content = data.content[0].text;

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## Claude AI Response\n\n${content}\n\n---\n*This response was generated by Claude Sonnet 4*`
            });

            return { success: true };
